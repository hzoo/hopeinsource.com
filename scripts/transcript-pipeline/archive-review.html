<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcript review</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--paper:#fffdf0;--ink:#253329;--muted:#778073;--line:#dedfcf;--green:#315e3e;--soft:#e9eddf;--amber:#f0e2b8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 'Avenir Next',sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:transparent}button{padding:9px 14px;min-height:42px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:3px}a{color:var(--green)}[hidden]{display:none!important}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}.hud{max-width:850px;margin:auto;min-height:70px;padding:12px 24px;display:flex;align-items:center;gap:18px}select{flex:1;width:0;min-width:90px;border:0;padding:8px 0;font-weight:600;text-overflow:ellipsis}#count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.nav{display:flex;gap:5px}.nav button{padding:6px 12px;font-size:18px;border:0}
main{max-width:800px;margin:36px auto 120px;padding:0 28px}.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}.transport>button{border:0;background:var(--soft)}#play{min-width:91px;background:var(--green);color:var(--paper)}#seek{flex:1;min-width:90px;accent-color:var(--green)}#time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.transport select{flex:none;width:66px;min-width:0;padding:5px;font-size:12px;border:1px solid var(--line);font-weight:400}.options{display:flex;gap:18px;width:100%;margin-top:2px;font-size:12px;color:var(--muted)}.options label{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:var(--green)}
.context{font-size:14px;color:var(--muted);margin:18px 0;line-height:1.65;white-space:pre-wrap}.attribution{display:flex;align-items:center;gap:8px;margin:18px 0 7px;font-size:12px}.attribution button{padding:0 5px;border:0;min-height:34px;font-weight:600;color:var(--green)}.attribution input{width:150px;padding:4px 8px}.attribution a{margin-left:auto;font-variant-numeric:tabular-nums;text-decoration:none;color:var(--muted)}#excerpt{font-size:21px;line-height:1.65;white-space:pre-wrap;text-wrap:pretty}#excerpt button{font:inherit;background:var(--amber);border:0;border-radius:3px;padding:0 3px;min-height:0;text-align:left;line-height:inherit;box-decoration-break:clone}#excerpt button:hover{background:#e6d59a}.edit{margin:19px 0 16px}#replacement{width:100%;resize:none;overflow:hidden;min-height:52px;background:#fffef9;padding:12px 15px;font-size:19px;line-height:1.5;border-color:#b8c7ad}.suggestions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}.suggestions button{font-size:14px;text-align:left;border-color:#bbc9b2;max-width:100%;white-space:pre-wrap}.suggestions small{color:var(--muted);font-size:12px}#note{color:var(--muted);font-size:12px;margin:8px 0 14px}details{font-size:12px;color:var(--muted);margin:14px 0}summary{cursor:pointer}#full{width:100%;min-height:150px;resize:vertical;margin-top:8px;padding:12px;font-size:16px;color:var(--ink)}.actions{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:12px max(22px,calc((100vw - 744px)/2));padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}.primary{background:var(--green);color:var(--paper);border-color:var(--green)}.primary:hover{background:#23472e}#saved{margin-left:auto;font-size:12px;color:var(--muted)}.shortcuts{font-size:11px;color:var(--muted);margin-top:22px}.shortcuts span{margin-right:14px}kbd{font:11px ui-monospace,monospace}#error{color:#9d3e24;font-size:13px;margin-top:12px}#empty{font:28px/1.4 Georgia,serif;margin-top:90px}#empty button{font:14px 'Avenir Next',sans-serif;margin-top:20px;display:block}button:active{transform:scale(.96)}@media(prefers-reduced-motion:reduce){button:active{transform:none}}@media(max-width:600px){.hud{padding:8px 15px;gap:8px}main{padding:0 18px;margin-top:22px}#excerpt{font-size:19px}.context{font-size:13px}.nav button{padding:5px 8px}.shortcuts{line-height:2}.transport{gap:5px}#time{min-width:39px}.actions{padding-left:16px;padding-right:16px;gap:6px}.actions button{padding-left:11px;padding-right:11px}#saved{display:none}}
</style>
</head>
<body>
<header><div class="hud"><select id="episode" aria-label="Episode"><option value="">All episodes</option></select><span id="count"></span><div class="nav"><button id="prev" aria-label="Previous passage">←</button><button id="next" aria-label="Next passage">→</button></div></div></header>
<main>
<div id="card" hidden>
<div class="transport"><button id="play" aria-label="Play excerpt">▶ Play</button><button id="replay" aria-label="Replay excerpt">↺</button><button id="back" aria-label="Back three seconds">−3</button><input id="seek" type="range" step=".1" aria-label="Audio position"><span id="time"></span><select id="speed" aria-label="Playback speed"><option>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value=".8">.8×</option></select><div class="options"><label><input id="loop" type="checkbox">Loop</label><label><input id="autoplay" type="checkbox" checked>Autoplay next</label></div></div>
<div class="attribution"><button id="speaker-button" title="Change speaker"></button><input id="speaker" aria-label="Speaker" hidden><a id="source" target="_blank" rel="noopener"></a></div>
<div id="excerpt"></div>
<div class="edit"><textarea id="replacement" rows="1" aria-label="Correct these words"></textarea><div id="suggestions" class="suggestions"></div></div>
<p id="note"></p>
<details><summary>Context</summary><div id="before" class="context"></div><div id="after" class="context"></div></details>
<details id="full-edit"><summary>Edit whole passage</summary><textarea id="full" aria-label="Whole passage"></textarea></details>
<div class="actions"><button id="accept" class="primary" aria-label="Save correction and next passage">Save →</button><button id="keep">Keep words</button><button id="skip">Skip</button><button id="undo" aria-label="Undo last decision">↶</button><span id="saved" role="status"></span></div>
<div class="shortcuts"><span><kbd>Space</kbd> play</span><span><kbd>R</kbd> replay</span><span><kbd>Enter</kbd> save</span><span><kbd>K</kbd> keep</span><span><kbd>S</kbd> skip</span><span><kbd>E</kbd> edit</span><span><kbd>← →</kbd> browse</span></div>
</div>
<div id="empty" hidden>No passages left in this pass.<button id="show-all">Review saved passages</button></div>
<p id="error" role="alert"></p>
</main>
<audio id="audio" preload="metadata"></audio>
<script>
const $=s=>document.querySelector(s),audio=$('#audio');let data,items=[],index=0,decisions={},history=[],current,range,fullChanged=false,showResolved=false,timer,saving=Promise.resolve();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=s=>{s=Math.max(0,Math.floor(s||0));return(s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0'):Math.floor(s/60))+':'+String(s%60).padStart(2,'0')};
function resolved(item){const d=decisions[item.id];return d?.item_revision===item.revision&&['accepted','kept','skipped'].includes(d.state)}
function filter(){items=data.items.filter(i=>(!$('#episode').value||i.episode===$('#episode').value)&&(showResolved||!resolved(i)));index=Math.max(0,Math.min(index,items.length-1))}
function editedText(){if(fullChanged)return $('#full').value;const value=$('#replacement').value;return current.original.slice(0,range.start)+value+current.original.slice(range.end)}
function resize(){const t=$('#replacement');t.style.height='auto';t.style.height=Math.max(52,t.scrollHeight+2)+'px'}
function restoreDraft(){const d=decisions[current.id];return d?.item_revision===current.revision?d:null}
function render(){audio.pause();$('#error').textContent='';$('#saved').textContent='';$('#card').hidden=!items.length;$('#empty').hidden=!!items.length;$('#count').textContent=items.length?(index+1)+' / '+items.length:'0';$('#prev').disabled=index<=0;$('#next').disabled=index>=items.length-1;$('#undo').disabled=!history.length;if(!items.length){current=null;return}current=items[index];$('#episode').options[0].textContent=$('#episode').value?'All episodes':'All episodes · '+current.title;location.hash='review='+encodeURIComponent(current.id);const d=restoreDraft();const at=current.original.toLowerCase().indexOf(current.quote.toLowerCase());const unique=at>=0&&current.original.toLowerCase().indexOf(current.quote.toLowerCase(),at+1)<0;range=unique?{start:at,end:at+current.quote.length}:{start:0,end:current.original.length};const quote=current.original.slice(range.start,range.end);$('#replacement').value=d?.replacement??quote;$('#full').value=d?.text??current.original;fullChanged=!!d?.full_edit;$('#full-edit').open=fullChanged;$('#speaker').value=d?.speaker??current.speaker;$('#speaker-button').textContent=$('#speaker').value;$('#speaker-button').hidden=false;$('#speaker').hidden=true;const left=current.original.slice(Math.max(0,range.start-100),range.start),right=current.original.slice(range.end,range.end+100);$('#excerpt').innerHTML=(range.start>100?'… ':'')+esc(left)+'<button id="suspect" type="button">'+esc(quote)+'</button>'+esc(right)+(range.end+100<current.original.length?' …':'');$('#suspect').onclick=()=>{$('#replacement').focus();$('#replacement').select()};$('#before').textContent=current.before.slice(-160);$('#after').textContent=current.after.slice(0,160);$('#note').textContent=current.note;$('#suggestions').innerHTML=current.suggestion?'<small>Possible wording</small><button id="suggestion" type="button">'+esc(current.suggestion)+'</button>':'';if(current.suggestion)$('#suggestion').onclick=()=>{$('#replacement').value=current.suggestion;fullChanged=false;$('#full-edit').open=false;changed();$('#replacement').focus()};$('#source').textContent=current.timestamp??(current.clip_timing==='neighbor_window'?'Time uncertain':'Untimed');$('#source').href=data.episodes.find(e=>e.id===current.episode).url+'#'+current.anchor;const nextSrc=new URL(current.audio,location.href).href;if(audio.src!==nextSrc)audio.src=nextSrc;$('#seek').min=current.clip_start;$('#seek').max=current.clip_end??(Number.isFinite(audio.duration)?audio.duration:1);$('#seek').value=current.clip_start;$('#time').textContent=clock(current.clip_start);if(audio.readyState>=1)audio.currentTime=current.clip_start;resize()}
function snapshot(state){return{id:current.id,item_revision:current.revision,state,replacement:$('#replacement').value,text:editedText(),speaker:$('#speaker').value,full_edit:fullChanged,updated_at:new Date().toISOString()}}
function localSave(value){decisions[value.id]=value;localStorage.setItem('archive-review-decisions',JSON.stringify(decisions))}
function persist(value){localSave(value);saving=saving.catch(()=>{}).then(async()=>{const r=await fetch('/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});if(!r.ok)throw new Error(await r.text());if(current?.id===value.id)$('#saved').textContent='Saved'});saving.catch(()=>{$('#error').textContent='Saved in this browser. Disk save failed; retry by pressing Save.'});return saving}
function changed(){if(!current)return;resize();$('#saved').textContent='';clearTimeout(timer);const v=snapshot('draft');localSave(v);timer=setTimeout(()=>persist(v),450)}
async function play(){if(!current)return;try{if(audio.error)throw new Error('Audio error');if(audio.readyState<1)await new Promise((resolve,reject)=>{audio.addEventListener('loadedmetadata',resolve,{once:true});audio.addEventListener('error',reject,{once:true});setTimeout(()=>reject(new Error('Audio timeout')),8000)});const end=current.clip_end??audio.duration;if(audio.currentTime<current.clip_start||audio.currentTime>=end)audio.currentTime=current.clip_start;await audio.play();$('#error').textContent=''}catch{$('#error').textContent='Audio unavailable. Try Replay.'}}
async function move(delta){if(!current)return;clearTimeout(timer);const v=snapshot(restoreDraft()?.state??'draft');await persist(v).catch(()=>{});index=Math.max(0,Math.min(items.length-1,index+delta));render();if($('#autoplay').checked)play()}
async function decide(state){if(!current||$('#accept').disabled)return;clearTimeout(timer);const id=current.id,previous=structuredClone(decisions[id]??null);let v=snapshot(state);if(state==='kept')v={...v,text:current.original,replacement:current.original.slice(range.start,range.end),speaker:current.speaker,full_edit:false};$('#accept').disabled=true;try{await persist(v);history.push({id,previous});const next=items[index+1]?.id;filter();index=next?Math.max(0,items.findIndex(i=>i.id===next)):Math.min(index,items.length-1);render();if(current&&$('#autoplay').checked)play()}catch{$('#error').textContent='Could not save to disk. Your correction remains in this browser.'}finally{$('#accept').disabled=false}}
$('#play').onclick=()=>audio.paused?play():audio.pause();$('#replay').onclick=()=>{if(current){audio.currentTime=current.clip_start;play()}};$('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-3);$('#seek').oninput=()=>audio.currentTime=Number($('#seek').value);$('#speed').onchange=()=>audio.playbackRate=Number($('#speed').value)||1;
audio.onplay=()=>$('#play').textContent='Ⅱ Pause';audio.onpause=()=>$('#play').textContent='▶ Play';audio.onloadedmetadata=()=>{if(!current)return;$('#seek').max=Math.min(current.clip_end??audio.duration,audio.duration)};audio.ontimeupdate=()=>{if(!current)return;$('#seek').value=audio.currentTime;$('#time').textContent=clock(audio.currentTime);if(current.clip_end!==null&&audio.currentTime>=current.clip_end){if($('#loop').checked)audio.currentTime=current.clip_start;else audio.pause()}};audio.onended=()=>{if(current&&$('#loop').checked){audio.currentTime=current.clip_start;play()}};audio.onerror=()=>$('#error').textContent='Audio unavailable. You can still edit or skip this passage.';
$('#replacement').oninput=()=>{fullChanged=false;$('#full-edit').open=false;changed()};$('#full').oninput=()=>{fullChanged=true;changed()};$('#full-edit').ontoggle=()=>{if($('#full-edit').open&&!fullChanged)$('#full').value=editedText()};$('#speaker-button').onclick=()=>{$('#speaker-button').hidden=true;$('#speaker').hidden=false;$('#speaker').focus();$('#speaker').select()};$('#speaker').oninput=changed;
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#accept').onclick=()=>decide('accepted');$('#keep').onclick=()=>decide('kept');$('#skip').onclick=()=>decide('skipped');$('#episode').onchange=async()=>{clearTimeout(timer);if(current)await persist(snapshot(restoreDraft()?.state??'draft')).catch(()=>{});showResolved=false;index=0;filter();render()};$('#show-all').onclick=()=>{showResolved=true;filter();index=0;render()};$('#undo').onclick=async()=>{const h=history.pop();if(!h)return;const item=data.items.find(i=>i.id===h.id);const at=item.original.toLowerCase().indexOf(item.quote.toLowerCase()),unique=at>=0&&item.original.toLowerCase().indexOf(item.quote.toLowerCase(),at+1)<0;const v=h.previous??{id:h.id,item_revision:item.revision,state:'draft',replacement:unique?item.original.slice(at,at+item.quote.length):item.original,text:item.original,speaker:item.speaker,full_edit:false,updated_at:new Date().toISOString()};await persist(v);filter();index=items.findIndex(i=>i.id===h.id);render()};
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const typing=e.target.matches('textarea,input,select');if(e.target.matches('select')||(['Enter',' '].includes(e.key)&&e.target.closest('button,a,input[type=checkbox]')))return;if(e.key==='Enter'&&(!e.shiftKey||!typing)){e.preventDefault();decide('accepted');return}if(typing){if(e.key==='Escape')e.target.blur();return}const actions={' ':()=>$('#play').click(),r:()=>$('#replay').click(),s:()=>decide('skipped'),k:()=>decide('kept'),e:()=>{$('#replacement').focus();$('#replacement').select()},ArrowLeft:()=>move(-1),ArrowRight:()=>move(1)};if(actions[e.key]){e.preventDefault();actions[e.key]()}});
window.addEventListener('hashchange',()=>{if(!data)return;const id=decodeURIComponent(location.hash.replace('#review=',''));if(id===current?.id)return;const target=data.items.find(i=>i.id===id);if(!target)return;clearTimeout(timer);const draft=current&&restoreDraft();if(draft)persist(snapshot(draft.state)).catch(()=>{});if($('#episode').value&&$('#episode').value!==target.episode)$('#episode').value=target.episode;if(resolved(target))showResolved=true;filter();index=items.findIndex(i=>i.id===id);if(index>=0)render()});
(async()=>{try{data=await(await fetch('review.json')).json();try{decisions=JSON.parse(localStorage.getItem('archive-review-decisions')||'{}')}catch{}try{const r=await fetch('review-decisions.json');if(r.ok){const remote=await r.json();for(const[id,d]of Object.entries(remote.decisions??{}))if(!decisions[id]||d.updated_at>decisions[id].updated_at)decisions[id]=d}}catch{}$('#episode').innerHTML='<option value="">All episodes</option>'+data.episodes.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.title)+'</option>').join('');filter();const id=decodeURIComponent(location.hash.replace('#review=',''));index=Math.max(0,items.findIndex(i=>i.id===id));render()}catch{$('#error').textContent='Could not load the review queue. Reload to retry.'}})();
</script>
</body>
</html>
