<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transcript</title><link rel="icon" href="data:,"><style>
:root{color-scheme:light;--paper:#f6f4ed;--ink:#292d26;--muted:#666b5f;--line:#d9dccf;--green:#365c3b;--amber:#8a6224}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.7 Georgia,serif}button,input,select,nav,.kicker,.meta,.state,.stats,.panel-label{font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font-size:13px;border:1px solid #b5bba9;border-radius:5px;background:#fcfbf6;color:var(--ink);padding:8px 11px}button,a{cursor:pointer}button:hover{background:#e7edde}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}a{color:var(--green)}main{max-width:1210px;margin:auto;padding:26px 32px 100px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--green)}h1{font-size:clamp(32px,4vw,48px);font-weight:400;line-height:1.12;letter-spacing:-1px;margin:14px 0 20px}h2{font-size:29px;line-height:1.25;font-weight:400;max-width:760px;margin:24px 0 15px}h3{font-size:21px;font-weight:400;margin:0 0 15px}.intro{max-width:780px;color:var(--muted);font-size:18px}.state{display:inline-block;color:var(--amber);font-size:12px;margin-left:14px}.stats{font-size:13px;display:flex;gap:24px;border-block:1px solid var(--line);padding:11px 0;margin:15px 0;flex-wrap:wrap;color:var(--muted)}.stats b{font-weight:500;color:var(--ink)}.controls{position:sticky;top:0;z-index:10;background:var(--paper);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0;flex-wrap:wrap}.controls audio{height:36px;flex:1 1 280px;min-width:150px}.controls input{min-width:100px;width:185px}.tabs{display:flex;gap:5px}.tabs button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}.grid{display:grid;grid-template-columns:215px minmax(0,1fr);gap:48px;margin-top:16px}.aside{font:13px/1.6 -apple-system,sans-serif;align-self:start;position:sticky;top:82px;max-height:80vh;overflow:auto}.aside a{display:block;text-decoration:none;margin:10px 0;color:var(--muted)}.aside a:hover{color:var(--green)}.aside .label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;margin:26px 0 9px}.passage{padding:20px 0;border-top:1px solid var(--line);scroll-margin-top:105px}.meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:9px;flex-wrap:wrap}.meta .speaker{font-size:13px;color:var(--ink);font-weight:600}.meta button{padding:3px 9px;font-variant-numeric:tabular-nums}.passage p{margin:0;max-width:750px;white-space:pre-line}.passage.playing{border-left:3px solid var(--green);padding-left:15px}.passage details{font-size:15px;margin-top:12px}.passage summary{cursor:pointer;color:var(--muted);font:12px/1.6 -apple-system,sans-serif}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:16px}.panel-label{font-size:10px;color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px}.issue{border-left:2px solid #b09057;background:#f0eadb;padding:12px 16px;margin:14px 0;font-size:14px}.issue .meta{margin-bottom:5px}.issue button{margin-top:8px;font-size:12px}.issue.checked{border-color:var(--green);background:#e9eee2}.empty{color:var(--muted);padding:28px 0}.editorial{margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}.editorial>summary{font:14px/1.6 -apple-system,sans-serif;cursor:pointer}.editorial section{padding:20px 0 0}.title-option{display:grid;grid-template-columns:1fr auto;gap:20px;margin:12px 0}.title-option span{font-size:13px;color:var(--muted)}.source-link{font:12px/1.5 -apple-system,sans-serif}.export{margin-top:15px}.footer{font-size:13px;color:var(--muted);padding-top:35px;border-top:1px solid var(--line);margin-top:40px}.feedback{font:13px/1.6 -apple-system,sans-serif;color:var(--amber);padding:8px 0}.feedback:empty{display:none}.legend{font-size:13px;color:var(--muted);margin-top:10px}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:15px}.aside{position:static;max-height:none;order:2}.aside nav{display:none}.aside .label{margin-top:6px}.compare{grid-template-columns:1fr}.controls{gap:7px}.controls input{flex:1;width:120px}main{padding:25px 18px 70px}.passage{scroll-margin-top:165px}.title-option{grid-template-columns:1fr;gap:3px}.state{display:block;margin:8px 0}.stats{gap:15px}h2{font-size:26px}}
del{background:#f8e1d6;text-decoration-color:#93513b}ins{background:#dfedda;text-decoration:none}.diff-note{font:12px/1.6 -apple-system,sans-serif;color:var(--amber);margin:8px 0}.controls [hidden]{display:none}.passage p{white-space:pre-line}main{max-width:1100px}header{max-width:800px}h1{font-size:36px;margin:16px 0 30px}.controls{margin-bottom:28px}.controls input{margin-left:auto}.controls audio{flex:0 1 280px}.passage{position:relative;border:0;padding:15px 0 20px}.passage p{max-width:780px}.meta{margin-bottom:6px}.meta button{border:0;background:none;padding:0;color:var(--muted)}.meta a{text-decoration:none;color:#8b9081}.compare p{font-size:17px}.compare{gap:32px}.pending{max-width:780px;font:13px/1.6 -apple-system,sans-serif;color:var(--amber)}.pending p{padding-top:8px}.anchor{position:absolute;top:0;scroll-margin-top:100px}[hidden]{display:none!important}#feedback{font:13px -apple-system,sans-serif}h2{margin-top:44px}@media(max-width:820px){h1{font-size:30px}.controls audio{flex:1 1 100%}.compare{gap:15px}}.passage.ack{display:flex;align-items:baseline;gap:10px;padding:0 0 12px 16px;margin-top:-9px;font-size:14px}.passage.ack:before{content:"↳";color:var(--muted)}.passage.ack .meta{display:contents}.passage.ack .speaker{font-size:11px}.passage.ack .meta button{font-size:10px;order:2}.passage.ack .meta a{order:3;font-size:10px}.passage.ack p{font:14px/1.5 Georgia,serif}.passage.ack .pending{display:none}
.passage.ack{width:fit-content;max-width:100%}.passage.ack-right{margin-left:auto}.passage.ack-left{margin-right:auto}.passage.nod{padding:0 0 12px;margin-top:-7px;gap:0}.passage.nod:before,.passage.nod .meta{display:none}.passage.nod p button{font:13px/1.5 Georgia,serif;padding:3px 11px;border-radius:999px;background:#e9ece2;border:1px solid #d6dccf}</style></head><body><main><header><h1 id="title"></h1></header><div class="controls"><div class="tabs"><button data-mode="reading" aria-pressed="true">Transcript</button><button data-mode="diff" aria-pressed="false">Diff</button></div><select id="stage" aria-label="Compare versions" hidden><option value="cleanup">Corrected → Reading</option><option value="recognition">Generated → Corrected</option></select><input id="search" type="search" aria-label="Search transcript" placeholder="Find words…"><audio id="audio" controls preload="metadata" hidden></audio></div><div id="feedback" role="status"></div><section id="transcript"></section></main><script>
const data=/*__EPISODE__*/;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clock=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let mode='reading',track=null;const byId=Object.fromEntries(data.corrected.map(t=>[t.id,t])),headings=Object.fromEntries((data.editorial.headings||[]).map(h=>[h.turn_id,h.text]));
$('#title').textContent=data.publication?.title||data.editorial.working_title||data.manifest.episode_id;document.title=$('#title').textContent;
/*__COMPACT_REPLY__*/
const compactIds=new Set(),replySides=new Map();let previous=null,replySide='left';
const knownSpeakers=[...new Set(data.corrected.map(t=>t.speaker))].filter(s=>! /^(speaker\s|unconfirmed\b)/i.test(s));const speakerSides=new Map(knownSpeakers.map((s,i)=>[s,i===0?'right':'left']));
for(const t of data.reading.filter(t=>t.text&&!t.merged_into)){if(!data.review.some(r=>r.turn_id===t.id&&r.state==='open')&&knownSpeakers.length===2&&speakerSides.has(t.speaker)&&previous&&speakerSides.has(previous.speaker)&&previous.speaker!==t.speaker&&!headings[t.id]&&isCompactReply(t.text)){compactIds.add(t.id);replySides.set(t.id,replySide)}else replySide=speakerSides.get(t.speaker);previous=t;}
function render(){const q=$('#search').value.toLowerCase(),stage=$('#stage').value;$('#stage').hidden=mode!=='diff';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));const seen=new Set();$('#transcript').innerHTML=data.reading.filter(t=>!t.merged_into&&(mode==='diff'||t.text)&&(!q||`${t.text} ${byId[t.id].text} ${t.speaker}`.toLowerCase().includes(q))).map(t=>{const c=data.comparisons[t.id][stage],issues=data.review.filter(r=>r.turn_id===t.id&&r.state==='open');const rawSpeakers=[...new Set(data.raw.filter(r=>(t.source_turn_ids||[t.id]).includes(r.id)).map(r=>r.speaker))].join(' / ');const speakerChanged=stage==='recognition'&&rawSpeakers!==byId[t.id].speaker;if(mode==='diff'&&c.before_html===c.after_html&&!speakerChanged&&!issues.length)return '';const anchors=[t.anchor,...(t.alias_anchors||[]),...(mode==='reading'?t.reading_alias_anchors||[]:[])].filter(a=>{if(seen.has(a))return false;seen.add(a);return true}).map(a=>`<span id="${esc(a)}" class="anchor"></span>`).join('');const content=mode==='diff'?`<div class="compare"><div><div class="panel-label">${stage==='recognition'?'Generated · '+esc(rawSpeakers):'Corrected'}</div><p>${c.before_html||'—'}</p></div><div><div class="panel-label">${stage==='recognition'?'Corrected · '+esc(t.speaker):'Reading'}</div><p>${c.after_html||'<em>Removed</em>'}</p></div></div>`:`<p>${compactIds.has(t.id)?`<button data-play="${t.id}" aria-label="${esc(t.speaker)}: ${esc(t.text)}. Play at ${clock(t.start)}">${esc(t.text)}</button>`:esc(t.text)}</p>`;return `${headings[t.id]&&mode==='reading'?`<h2>${esc(headings[t.id])}</h2>`:''}<article class="passage ${mode==='reading'&&compactIds.has(t.id)?'ack ack-'+replySides.get(t.id)+' nod':''}" data-turn="${t.id}" title="${esc(t.speaker)} · ${clock(t.start)}">${anchors}<div class="meta"><span class="speaker">${esc(t.speaker)}</span><button data-play="${t.id}" title="Play passage">${clock(t.start)} ▷</button><a href="#${t.anchor}" aria-label="Link to passage at ${clock(t.start)}">#</a></div>${content}${issues.length?`<details class="pending"><summary>Potential fix${issues.length>1?'es':''}</summary>${issues.map(r=>`<p>${esc(r.note)} <a href="editor.html#review=${encodeURIComponent(r.id)}">Edit →</a></p>`).join('')}</details>`:''}</article>`}).join('')||'<p class="empty">No matches.</p>';}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-mode]');if(tab){mode=tab.dataset.mode;render()}const b=e.target.closest('[data-play]');if(!b)return;const t=byId[b.dataset.play],w=data.words.find(w=>w.id===t.word_ids[0]),next=data.manifest.tracks.find(x=>x.id===w.track_id),audio=$('#audio');audio.hidden=false;if(track?.id!==next.id){track=next;audio.src=track.audio;}audio.currentTime=Math.max(0,t.start-track.offset_seconds-.4);try{await audio.play();$('#feedback').textContent=''}catch{$('#feedback').textContent='Press play to listen.'}});
$('#stage').onchange=render;$('#search').oninput=render;
function restoreHash(){const hash=decodeURIComponent(location.hash.slice(1));if(!hash)return;const sec=hash.startsWith('t=')?Number(hash.slice(2)):null;const t=sec!==null?data.reading.filter(t=>t.text&&t.start<=sec).at(-1):data.reading.find(t=>t.text&&[t.anchor,...(t.alias_anchors||[]),...(t.reading_alias_anchors||[])].includes(hash));if(t){mode='reading';$('#search').value='';render();document.querySelector(`[data-turn="${t.id}" title="${esc(t.speaker)} · ${clock(t.start)}"]`)?.scrollIntoView()}}
render();requestAnimationFrame(restoreHash);window.addEventListener('hashchange',restoreHash);
</script></body></html>
